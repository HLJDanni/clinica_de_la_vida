# Blueprint de Render: app web (API + SPA). La base de datos PostgreSQL vive en Neon (plan gratuito).
# Desplegar: https://render.com/deploy?repo=https://github.com/HLJDanni/clinica_de_la_vida
services:
  - type: web
    name: clinica-pasion-por-la-vida
    runtime: node
    plan: free
    region: oregon
    branch: main
    # NODE_ENV=production omite devDependencies; Vite se necesita para compilar el cliente
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci
    startCommand: cd server && npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Cadena de conexión de Neon (región AWS US West 2, Oregón), con ?sslmode=require.
      # Se configura en el panel de Render; no queda en el repositorio.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Render las pide al crear el Blueprint (no quedan en el repositorio)
      - key: DOCTOR_PASSWORD
        sync: false
      - key: RECEPTION_PASSWORD
        sync: false
